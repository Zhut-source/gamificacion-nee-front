<main class="landing-container">
  <section class="presentation-card" aria-labelledby="landing-title">
    <h1 id="landing-title" class="titulo-landing-page">
      ¡Aprende lógica mientras juegas!
    </h1>

    <div class="area-description">
      <p #descripcion class="text-landing">
        Supera niveles, gana insignias y descubre una forma divertida de
        fortalecer tus habilidades a tu propio ritmo.
      </p>

      <button
        type="button"
        class="speaker-button"
        title="Escuchar descripción"
        aria-label="Escuchar descripción"
        [class.active]="tts.isPlaying"
        (click)="leerDescripcion()"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="32"
          height="32"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path
            d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z"
          />
          <path d="M16 9a5 5 0 0 1 0 6" />
          <path d="M19.364 18.364a9 9 0 0 0 0-12.728" />
        </svg>
        <span>Escuchar</span>
      </button>
    </div>

    <button type="button" class="comenzar" (click)="goToLogin()">
      Comenzar
    </button>
  </section>
</main>
