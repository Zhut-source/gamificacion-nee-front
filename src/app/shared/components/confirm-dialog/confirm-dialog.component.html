<div class="confirm-overlay" *ngIf="data" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
  <div class="confirm-modal">
    <div class="modal-header">
      <span class="warning-icon" aria-hidden="true">⚠</span>
      <h2 id="dialog-title">{{ data.title }}</h2>
    </div>
    
    <div class="modal-body">
      <p>{{ data.message }}</p>
    </div>

    <div class="modal-footer">
        <button type="button" 
                class="alert-btn read-btn" 
                (click)="escucharComfirm()" 
                [attr.aria-label]="'Escuchar mensaje: ' + data.message"
                [class.speaking]="tts.isPlaying">
          <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z"/>
            <path d="M16 9a5 5 0 0 1 0 6"/><path d="M19.364 18.364a9 9 0 0 0 0-12.728"/>
          </svg>
        </button>
      <button type="button" class="btn-cancel" (click)="onCancel()">
        {{ data.cancelText || 'Cancelar' }}
      </button>
      <button type="button" class="btn-confirm" (click)="onConfirm()">
        {{ data.confirmText || 'Sí, estoy seguro' }}
      </button>
    </div>
  </div>
</div>
